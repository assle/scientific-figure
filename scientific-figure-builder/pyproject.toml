[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scientific-figure-builder"
version = "0.1.0"
description = "OpenCode-first scientific-figure orchestration skill (v1)."
readme = "SKILL.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
ark = [
    "volcengine-python-sdk[ark]>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["figure_tools"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "scientific_figure_builder_data/schemas"
"templates" = "scientific_figure_builder_data/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
