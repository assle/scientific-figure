[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scientific-figure-builder"
version = "0.1.0"
description = "Open-source scientific-figure workflow toolkit with a Skill, local MCP server, CLI, and configuration app."
readme = "SKILL.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "python-pptx>=0.6.23",
    "ruamel.yaml>=0.18",
    "keyring>=25.6",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
qa = [
    "opencv-python-headless",
]
qa-ocr = [
    "paddleocr",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["figure_tools"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "scientific_figure_builder_data/schemas"
"templates" = "scientific_figure_builder_data/templates"
"SKILL.md" = "scientific_figure_builder_skill/SKILL.md"
"references" = "scientific_figure_builder_skill/references"
"commands" = "scientific_figure_builder_skill/commands"
"install.sh" = "scientific_figure_builder_skill/install.sh"
"install/install_delivery.py" = "scientific_figure_builder_skill/install/install_delivery.py"
"install/uninstall_delivery.py" = "scientific_figure_builder_skill/install/uninstall_delivery.py"
"install/auth_cleanup.py" = "scientific_figure_builder_skill/install/auth_cleanup.py"
"install/configure_opencode.py" = "scientific_figure_builder_skill/install/configure_opencode.py"
"install/configure_codex.py" = "scientific_figure_builder_skill/install/configure_codex.py"
"install/provider_environment.py" = "scientific_figure_builder_skill/install/provider_environment.py"
"figure_tools/resources" = "scientific_figure_builder_data/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
