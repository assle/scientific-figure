# Local development config for scientific-figure-builder.
# Use it WITHOUT installing the tool globally:
#   export SCIENTIFIC_FIGURE_CONFIG="$PWD/dev-config.yaml"
# Provider credentials are NOT stored here; set the key_env variables in the
# environment (e.g. export DEEPSEEK_API_KEY=... ARK_API_KEY=...).
#
# This file only needs to override model roles + providers; every other setting
# (canvas, export formats, limits, validation) falls back to the skill defaults
# in templates/default-project.yaml.

schema_version: "1.0"

# Model roles. Fill in each `model` with your real model id or endpoint id.
# `image_generate` MUST be a true image-generation model (e.g. Seedream).
# `vision_analyze` / `vision_validate` are multimodal (read-only) models.
models:
  image_generate:
    model: "doubao-seedream-5.0-lite"     # 例如 doubao-seedream-4-0 或 ep-xxxx
    provider: ark_seedream
  # Optional image-edit override; omit to reuse image_generate.
  # image_edit:
  #   model: "<seedream模型或端点id>"
  #   provider: ark_seedream
  vision_analyze:
    model: "deepseek-v4-flash-vision-exp"
    provider: deepseek
  vision_validate:
    model: "deepseek-v4-flash-vision-exp"
    provider: deepseek

# Provider endpoints. `key_env` names the env var holding that provider's key.
# - type: openai -> image generation/editing (/images/generations) + vision
#   (reference analysis / validation) via the OpenAI Responses API (/responses).
# - type: anthropic -> vision via /messages only; cannot generate images.
providers:
  deepseek:
    type: openai
    base_url: https://api.deepseek.com/
    key_env: DEEPSEEK_API_KEY
  ark_seedream:
    type: openai
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    key_env: ARK_API_KEY
    supports_image_edit: true
