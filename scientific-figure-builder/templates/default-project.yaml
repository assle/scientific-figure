# Default project configuration for scientific-figure-builder.
# This file contains NO secrets. Read the Ark API key from the ARK_API_KEY
# environment variable or a user-private file (see references/ark-interfaces.md).
#
# Configuration is merged in this order (plan section 5):
#   Skill defaults < user-local private config < project config < per-run overrides

schema_version: "1.0"

# Publication canvas defaults.
canvas:
  width: 180
  height: 90
  units: mm

# Common publication figure widths used when the user has not selected a
# custom width. Heights are derived from the canvas aspect ratio above.
figure_widths:
  half_column_cm: 6.5
  full_column_cm: 14.0

# Export formats. PNG, SVG, and PDF are default formal outputs; PPTX is optional.
export:
  formats: [png, svg, pdf]
  include_pptx: false
  dpi: 300
  export_target: general

# Concurrency and reliability limits (plan section 12).
limits:
  independent_asset_concurrency: 2
  max_quality_retries_per_asset: 2
  default_candidate_count: 1

# Fixed model roles (plan section 5). Two roles may share a model, but each role
# is configured independently. Replace the placeholders with fixed model IDs or
# Volcengine Ark Endpoint IDs. Do NOT use "latest" resolution.
models:
  image_generate:
    model: "<fixed-model-or-endpoint-id>"
  image_edit:
    model: "<fixed-model-or-endpoint-id>"
  vision_analyze:
    model: "<fixed-model-or-endpoint-id>"
  vision_validate:
    model: "<fixed-model-or-endpoint-id>"

# Optional domain template selection.
domain_template: null

# Image QA / layout validation (source-aware). All fields optional; omitted
# fields fall back to code defaults so older project configs keep working.
validation:
  enabled: true
  mode: source_aware

  deterministic:
    enabled: true
    text_overlap: true
    clipping: true
    panel_labels: true
    colorbar_collision: true
    typography: true

  thresholds:
    minimum_overlap_pixels: 2
    overlap_warning_ratio: 0.01
    overlap_error_ratio: 0.03
    minimum_gap_pixels: 4
    panel_padding_pixels: 2
    minimum_font_size_pt: 7
    critical_font_size_pt: 6
    font_size_tolerance_pt: 1

  evidence:
    enabled: true
    crop_padding_pixels: 30
    crop_scale: 4
    draw_boxes: true

  ocr:
    enabled: auto
    backend: paddleocr
    only_for:
      - raster_without_layout
      - image_asset

  multimodal:
    enabled: true
    mode: suspicious_regions
    max_regions: 12
