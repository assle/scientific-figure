<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Figure Builder workflow</title>
  <desc id="desc">Intake, planning, approval, execution, review and repair, then export.</desc>
  <defs>
    <linearGradient id="stageAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="210" rx="22" fill="#F7F9FD"/>
  <rect x="1" y="1" width="958" height="208" rx="21" fill="none" stroke="#E2E9F3"/>
  <text x="42" y="43" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" letter-spacing="1.6">ONE GOVERNED WORKFLOW</text>
  <text x="42" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#101828">From request to validated export</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(42 108)">
      <rect width="132" height="62" rx="14" fill="#FFFFFF" stroke="#DCE4EF"/>
      <rect x="0" y="0" width="132" height="5" rx="2.5" fill="url(#stageAccent)"/>
      <circle cx="23" cy="31" r="10" fill="#E8F0FF"/>
      <text x="23" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">01</text>
      <text x="43" y="29" font-size="13" font-weight="700" fill="#101828">Intake</text>
      <text x="43" y="46" font-size="10" fill="#667085">Clarify the target</text>
    </g>
    <g transform="translate(194 108)">
      <rect width="132" height="62" rx="14" fill="#FFFFFF" stroke="#DCE4EF"/>
      <rect x="0" y="0" width="132" height="5" rx="2.5" fill="url(#stageAccent)"/>
      <circle cx="23" cy="31" r="10" fill="#E8F0FF"/>
      <text x="23" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">02</text>
      <text x="43" y="29" font-size="13" font-weight="700" fill="#101828">Plan</text>
      <text x="43" y="46" font-size="10" fill="#667085">Graph and layout</text>
    </g>
    <g transform="translate(346 108)">
      <rect width="132" height="62" rx="14" fill="#FFFFFF" stroke="#DCE4EF"/>
      <rect x="0" y="0" width="132" height="5" rx="2.5" fill="url(#stageAccent)"/>
      <circle cx="23" cy="31" r="10" fill="#E8F0FF"/>
      <text x="23" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">03</text>
      <text x="43" y="29" font-size="13" font-weight="700" fill="#101828">Approve</text>
      <text x="43" y="46" font-size="10" fill="#667085">Confirm the plan</text>
    </g>
    <g transform="translate(498 108)">
      <rect width="132" height="62" rx="14" fill="#FFFFFF" stroke="#DCE4EF"/>
      <rect x="0" y="0" width="132" height="5" rx="2.5" fill="url(#stageAccent)"/>
      <circle cx="23" cy="31" r="10" fill="#E8F0FF"/>
      <text x="23" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">04</text>
      <text x="43" y="29" font-size="13" font-weight="700" fill="#101828">Execute</text>
      <text x="43" y="46" font-size="10" fill="#667085">Produce assets</text>
    </g>
    <g transform="translate(650 108)">
      <rect width="132" height="62" rx="14" fill="#FFFFFF" stroke="#DCE4EF"/>
      <rect x="0" y="0" width="132" height="5" rx="2.5" fill="url(#stageAccent)"/>
      <circle cx="23" cy="31" r="10" fill="#E8F0FF"/>
      <text x="23" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">05</text>
      <text x="43" y="29" font-size="13" font-weight="700" fill="#101828">Review</text>
      <text x="43" y="46" font-size="10" fill="#667085">Validate and repair</text>
    </g>
    <g transform="translate(802 108)">
      <rect width="128" height="62" rx="14" fill="#101828"/>
      <rect x="0" y="0" width="128" height="5" rx="2.5" fill="url(#stageAccent)"/>
      <circle cx="23" cy="31" r="10" fill="#1E3A8A"/>
      <text x="23" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#BFDBFE">06</text>
      <text x="43" y="29" font-size="13" font-weight="700" fill="#FFFFFF">Export</text>
      <text x="43" y="46" font-size="9" fill="#AFC2DC">PNG · SVG · PDF</text>
    </g>
  </g>

  <g fill="none" stroke="#93A4BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 139h14m-5-4 5 4-5 4"/>
    <path d="M326 139h14m-5-4 5 4-5 4"/>
    <path d="M478 139h14m-5-4 5 4-5 4"/>
    <path d="M630 139h14m-5-4 5 4-5 4"/>
    <path d="M782 139h14m-5-4 5 4-5 4"/>
  </g>
</svg>
