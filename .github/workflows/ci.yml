name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    defaults:
      run:
        working-directory: scientific-figure-builder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          working-directory: scientific-figure-builder

      - name: Run test suite
        run: uv run --frozen pytest

  quality:
    name: Typecheck and Product bundle
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scientific-figure-builder
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: scientific-figure-builder

      - name: Typecheck
        run: python ../scripts/verify_release_candidate.py --build

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v6
        with:
          name: product-bundle-${{ github.sha }}
          path: |
            scientific-figure-builder/dist/*.whl
            scientific-figure-builder/dist/*.tar.gz
            scientific-figure-builder/dist/SHA256SUMS
