name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Product bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scientific-figure-builder
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: scientific-figure-builder

      - name: Verify tag and Product version
        run: |
          product_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$product_version"
          test -f "../release-notes/$product_version.md"

      - name: Verify release candidate
        run: |
          uv run --frozen pytest
          uvx pyright --pythonpath .venv/bin/python figure_tools install ../scripts

      - name: Build formal artifacts
        run: |
          uv build --wheel
          core_wheel=$(find dist -maxdepth 1 -name 'scientific_figure_builder-*.whl' -print -quit)
          uv run --frozen python -m figure_tools.release_bundle \
            --repository-root .. \
            --output-dir dist \
            --core-wheel "$core_wheel" \
            --source-commit "$GITHUB_SHA"

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          product_version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --title "Scientific Figure Builder $product_version" \
            --notes-file "../release-notes/$product_version.md" \
            --verify-tag
