name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Product bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scientific-figure-builder
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
          working-directory: scientific-figure-builder

      - name: Verify tag and Product version
        run: |
          product_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$product_version"
          test -f "../release-notes/$product_version.md"
          if [ "$product_version" = "0.6.0" ]; then
            python ../scripts/release.py "$product_version" --check-acceptance
          fi
          python ../scripts/release.py "$product_version" --check-notes

      - name: Verify release candidate
        run: python ../scripts/verify_release_candidate.py --tests --build

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product_version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/tmp/release.json 2>/dev/null; then
            if python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1]))["isDraft"] else 1)' /tmp/release.json; then
              gh release upload "$GITHUB_REF_NAME" \
                dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
            else
              python ../scripts/release.py "$product_version" --check-release
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              --title "Scientific Figure Builder $product_version" \
              --notes-file "../release-notes/$product_version.md" \
              --verify-tag --draft
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
